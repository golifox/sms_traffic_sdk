name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: RuboCop
        run: bundle exec rubocop

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby-version: ['3.1', '3.2', '3.3', '3.4']
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true

      - name: RSpec
        run: bundle exec rspec

      # Loads the packaged gem outside Bundler, so a missing file or require hidden by dev dependencies fails here.
      - name: Smoke-test the built gem
        run: |
          gem build sms_traffic_sdk.gemspec
          gem install --no-document ./sms_traffic_sdk-*.gem
          cd "$RUNNER_TEMP"
          ruby -e 'require "sms_traffic_sdk"; puts SmsTraffic::VERSION'

      - name: Upload coverage to Codecov
        if: matrix.ruby-version == '3.3'
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  publish:
    needs: [lint, test]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # RubyGems trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Verify release tag matches gem version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(ruby -Ilib -rsms_traffic/version -e 'puts SmsTraffic::VERSION')"
          if [ "${TAG#v}" != "$version" ]; then
            echo "Release tag '$TAG' does not match SmsTraffic::VERSION '$version'" >&2
            exit 1
          fi

      - name: Build gem
        run: gem build sms_traffic_sdk.gemspec

      # rubygems_mfa_required rejects API-key pushes without an OTP; a trusted publisher token is accepted.
      - uses: rubygems/configure-rubygems-credentials@v2.1.0

      - name: Push gem to RubyGems
        run: gem push sms_traffic_sdk-*.gem
